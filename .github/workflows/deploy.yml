name: Deploy Bot

on: 
  push: 
    branches: 
      - master
    paths: 
      - 'packages/bot/**'

jobs:
  deploy: 
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - uses: actions/checkout@v4
      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: packages/bot
